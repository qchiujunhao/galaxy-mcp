[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=main
    --cov-report=term-missing
    --cov-report=html
markers =
    integration: Integration tests
    unit: Unit tests
    slow: Slow tests

[pytest]
asyncio_default_fixture_loop_scope = function
# The live scenarios need a real Galaxy, so a plain run deselects them; `-m live` on the
# command line comes later and wins.
addopts = -m "not live"
markers =
    live: runs both MCP servers against a real Galaxy (tests/live); opt in with -m live
